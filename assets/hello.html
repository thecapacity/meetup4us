<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Meetup4.us - Find the Perfect Central Meeting Location for Your Group</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Find the optimal central meeting location for your group. Enter everyone's addresses and discover the perfect midpoint for meetups, events, and gatherings. Free group location planning tool.">
  <meta name="keywords" content="meetup location, central meeting point, group meetup planner, find middle location, central address finder, meetup planning tool, group location coordinator, midpoint calculator, meeting location finder">
  <meta name="author" content="Meetup4.us">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://meetup4.us/">
  <meta property="og:title" content="Meetup4.us - Find the Perfect Central Meeting Location">
  <meta property="og:description" content="Free tool to find the optimal central meeting location for your group. Enter everyone's addresses and discover the perfect midpoint for meetups and events.">
  <meta property="og:image" content="https://meetup4.us/og-image.png">
  <meta property="og:site_name" content="Meetup4.us">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://meetup4.us/">
  <meta property="twitter:title" content="Meetup4.us - Find the Perfect Central Meeting Location">
  <meta property="twitter:description" content="Free tool to find the optimal central meeting location for your group. Enter everyone's addresses and discover the perfect midpoint.">
  <meta property="twitter:image" content="https://meetup4.us/og-image.png">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://meetup4.us/">
  
  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Meetup4.us",
    "description": "Find the optimal central meeting location for your group. Free tool to calculate the perfect midpoint for meetups, events, and gatherings.",
    "url": "https://meetup4.us",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "Web Browser",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "Calculate central meeting points",
      "Find venues near optimal location",
      "Share meeting locations via URL",
      "Interactive map visualization",
      "Address autocomplete"
    ]
  }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --blue: #1a73e8;
      --red: #ea4335;
      --text: #202124;
      --muted: #5f6368;
      --line: #e1e3e1;
      --soft: #f6f8fa;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #fff;
    }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh; /* Mobile: excludes browser toolbars */
      overflow: hidden;
    }

    #sidebar {
      width: 340px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 6px rgba(0,0,0,0.1);
      background: #fff;
      z-index: 2;
    }

    #search-area {
      position: relative;
      margin-bottom: 0.35rem;
    }

    #panel-scroll {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1rem 1rem;
    }

    /* The list scrolls on its own; search box and map stay put */
    #address-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #map { flex: 1; }


    input {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 0.75rem; /* room for the ◎ button */
      font-size: 16px; /* Prevents zoom on iOS */
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--blue); border-color: transparent; }
    input::placeholder { color: var(--blue); }

    /* Search-nearby toggle inside the search box */
    #nearby-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    #nearby-btn.on { background: var(--blue); color: #fff; }
    #search-area.nearby input { border-color: var(--blue); background: #eef4fe; }

    /* Map credit: visible on load, collapses to ⓘ (links to /about) */
    .map-credit {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0 6px 6px 0;
      padding: 2px 2px 2px 8px;
      background: rgba(255,255,255,0.85);
      border-radius: 14px;
      font-size: 12px;
      color: #333;
    }
    .map-credit a { color: inherit; }
    .map-credit.collapsed { padding: 2px; }
    .map-credit.collapsed .map-credit-text { display: none; }
    .map-credit-info {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      font-size: 16px;
      text-decoration: none;
    }

    #suggestions {
      position: absolute;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      max-height: 40dvh;
      overflow-y: auto;
      z-index: 10;
    }
    .suggestion { padding: 0.7rem 0.75rem; cursor: pointer; border-bottom: 1px solid var(--line); }
    .suggestion:last-child { border-bottom: none; }
    .suggestion:hover, .suggestion.active { background: var(--soft); }
    .suggestion.empty { color: var(--muted); cursor: default; font-style: italic; }
    .suggestion-title { font-size: 0.95rem; }
    .suggestion-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }


    .list-header { margin: 0 0 0.5rem; font-size: 1rem; }
    #list-count { color: var(--muted); font-weight: normal; }


    ul { list-style: none; padding: 0; margin: 0; }

    .address-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.35rem 0;
      padding: 0.35rem 0.35rem 0.35rem 0.6rem;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .address-text {
      flex: 1;
      text-align: left;
      background: none;
      border: none;
      padding: 0.4rem 0;
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.3;
      color: inherit;
      word-break: break-word;
      cursor: pointer;
    }
    .address-text:hover { color: var(--blue); }

    .remove-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }
    .remove-btn:hover { background: #fde8e6; color: var(--red); }

    .empty-list { color: var(--muted); font-style: italic; text-align: center; padding: 1rem; }



    /* Map markers */
    .center-dot {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--blue); border: 3px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(1.25rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 20;
    }

    /* ---------- Mobile: map on top, panel below ---------- */
    @media (max-width: 768px) {
      body { flex-direction: column; }

      #map {
        order: -1;
        flex: 1;
        min-height: 0;
      }

      #sidebar {
        width: 100%;
        flex: none;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.12);
        border-radius: 14px 14px 0 0;
        margin-top: -14px; /* tuck over the map edge */
      }

      #panel-scroll { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }

      /* Clear the panel's rounded edge, which overlaps the map by 14px */
      .maplibregl-ctrl-bottom-right .map-credit { margin-bottom: 20px; }

      /* Fixed-height list (~35% of screen); map gets the rest and never resizes */
      #address-list { flex: none; height: 35dvh; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="panel-scroll">
      <h3 class="list-header">Planning List <span id="list-count"></span></h3>

      <div id="search-area">
        <label for="address-input" style="position:absolute;left:-9999px;">Add a location</label>
        <input type="text" id="address-input" name="address-input"
               placeholder="+ Add location"
               autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
        <button id="nearby-btn" type="button" aria-pressed="false" hidden
                title="Search nearby" aria-label="Search nearby">◎</button>
        <div id="suggestions" role="listbox" hidden></div>
      </div>

      <ul id="address-list"></ul>
    </div>
  </div>
  <div id="map"></div>
  <div id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
